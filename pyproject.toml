[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isfahan-intersection-graph-mining"
version = "0.1.0"
description = "Deterministic SCATS traffic analysis and graph mining for Isfahan"
requires-python = ">=3.8"
dependencies = [
  "pandas>=2.0,<4",
  "numpy>=1.22,<3",
  "openpyxl>=3.0",
  "opencv-python>=4.6",
  "matplotlib>=3.3",
  "networkx>=2.5",
  "scikit-learn>=1.3",
  "plotly>=5.6",
  "nbformat>=5.1",
  "nbclient>=0.5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
isfahan_traffic = ["web/*.html"]
